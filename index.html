</head>
<body>

<!-- 狀態列底色（純色，讓 iOS 以深藍為基準，避免出現灰色漸層） -->
<div class="sbfill" aria-hidden="true"></div>

<!-- 背景裝飾 -->
<div class="deco" aria-hidden="true">
  <div style="top:112px;left:16px;font-size:24px" class="jf">🪼</div>
  <div style="top:208px;right:24px;font-size:30px" class="jf2">🪼</div>
  <div style="top:384px;left:40px;font-size:20px" class="jf">🪼</div>
  <div style="top:480px;right:48px;font-size:24px" class="jf2">🪼</div>
  <div style="bottom:160px;left:24px;font-size:30px" class="jf">🪼</div>
  <div style="bottom:80px;right:40px;font-size:20px" class="jf2">🪼</div>
  <div style="top:144px;right:25%;font-size:14px;color:#0891b2" class="pulse">🎵</div>
  <div style="top:320px;left:25%;font-size:16px;color:#0d9488" class="pulse">🎶</div>
  <div style="bottom:240px;right:33%;font-size:14px;color:#0284c7" class="pulse">🎵</div>
</div>

<!-- 頂部固定區域 -->
<header class="topbar">
  <div class="topin">
    <h1 class="brand">🐳 仁川演唱會慢旅</h1>
    <button class="fxbtn" data-act="fx">💱 匯率</button>
  </div>
  <div class="clk">
    <span class="clk-i">🇹🇼 <small>台灣</small> <b id="tw">--:--</b></span>
    <span class="clk-i">🇰🇷 <small>韓國</small> <b id="kr">--:--</b></span>
  </div>
  <nav class="daynav" id="daynavWrap" aria-label="日期切換">
    <div class="daynav-in" id="daynav"></div>
  </nav>
</header>

<main>
  <div id="main" class="stack"></div>
</main>

<!-- 底部導覽列：5 大分頁 -->
<nav class="bnav" aria-label="主導覽">
  <button class="nav-btn" id="nav-itinerary" data-act="tab" data-v="itinerary"><span class="ic">📅</span><span class="lb">行程</span></button>
  <button class="nav-btn" id="nav-concert" data-act="tab" data-v="concert"><span class="ic">🎤</span><span class="lb">演唱會資訊</span></button>
  <button class="nav-btn" id="nav-transit" data-act="tab" data-v="transit"><span class="ic">🚌</span><span class="lb">交通接駁</span></button>
  <button class="nav-btn" id="nav-checklist" data-act="tab" data-v="checklist"><span class="ic">🎒</span><span class="lb">清單</span></button>
  <button class="nav-btn" id="nav-safety" data-act="tab" data-v="safety"><span class="ic">🆘</span><span class="lb">獨旅安心卡</span></button>
</nav>

<!-- 韓文大字卡（全螢幕） -->
<div class="big hidden" id="big" role="dialog" aria-modal="true" aria-label="韓文大字卡">
  <button class="big-x" data-act="closeBig" aria-label="關閉">✕</button>
  <div class="big-in" id="bigBody"></div>
</div>

<!-- 新增行程彈窗 -->
<div class="mask hidden" id="addModal">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="新增行程">
    <div class="sheet-h">
      <span>➕ 新增行程（自動依時間排序）</span>
      <button data-act="closeAdd" aria-label="關閉">✕</button>
    </div>
    <div class="grid2">
      <div>
        <label for="addStart">開始時間 *</label>
        <input class="field" id="addStart" type="time" value="14:00">
      </div>
      <div>
        <label for="addEnd">結束時間（選填）</label>
        <input class="field" id="addEnd" type="time" value="15:00">
      </div>
    </div>
    <label for="addTitle">行程名稱 *</label>
    <input class="field" id="addTitle" type="text" placeholder="例：吃糖餅、逛大創、咖啡廳休息" maxlength="60">
    <label for="addCat">類別</label>
    <select class="field" id="addCat">
      <option value="美食">美食</option>
      <option value="購物">購物</option>
      <option value="休息">休息</option>
      <option value="交通">交通</option>
      <option value="演唱會">演唱會</option>
    </select>
    <label for="addKr">韓文地點名稱（選填，填寫可一鍵開地圖與大字卡）</label>
    <input class="field" id="addKr" type="text" placeholder="例：다이소 운서역점" maxlength="80">
    <label for="addTr">交通方式（選填）</label>
    <input class="field" id="addTr" type="text" placeholder="例：雲西站步行約 5 分鐘" maxlength="100">
    <label for="addNt">備註說明（選填）</label>
    <input class="field" id="addNt" type="text" placeholder="例：買暖暖包或應援小物" maxlength="150">
    <button class="pbtn fullbtn" data-act="saveEvent">儲存並自動排序</button>
  </div>
</div>

<!-- 匯率換算 -->
<div class="mask hidden" id="mask">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="匯率換算">
    <div class="sheet-h">
      <span>💱 韓元換算器</span>
      <button id="closeFx" aria-label="關閉">✕</button>
    </div>
    <label for="krw">韓元 KRW</label>
    <input class="field" id="krw" type="number" inputmode="decimal" placeholder="例：25000">
    <label for="rate">匯率（1 KRW = ? TWD，可手動微調）</label>
    <div class="addrow" style="margin-top:0">
      <input class="field" id="rate" type="number" inputmode="decimal" step="0.0001" value="0.0225">
      <button class="pbtn" id="rateRefresh" aria-label="自動更新匯率" style="padding:0 14px">🔄</button>
    </div>
    <div id="rateStatus" class="status-hint">有網路時自動更新匯率</div>
    <div class="res"><b id="twd">NT$ 0</b><small id="twdSub">輸入韓元即時換算</small></div>
    <div class="presets" id="presets"></div>
    <label for="twdIn">反向：新台幣 → 韓元</label>
    <input class="field" id="twdIn" type="number" inputmode="decimal" placeholder="例：1000">
    <div class="res" style="margin-top:10px"><b id="krwOut" style="font-size:22px">₩ 0</b></div>
  </div>
</div>

<script src="data.js?v=18"></script>
<script src="app.js?v=18"></script>
</body>
</html>
