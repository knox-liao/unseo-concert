        // 載入 localStorage (v6版本，若有舊版自動相容保留)
        let savedRawData = localStorage.getItem('nmixx_ice_trip_data_v6');
        let appData = defaultData;
        if (savedRawData) {
            try {
                let parsed = JSON.parse(savedRawData);
                // 合併預設值以防結構更新漏掉欄位
                appData = Object.assign({}, defaultData, parsed);
                if (!appData.hasOwnProperty('isEditable')) appData.isEditable = false;
            } catch(e) {
                appData = defaultData;
            }
        }

        function saveData() {
            localStorage.setItem('nmixx_ice_trip_data_v6', JSON.stringify(appData));
        }

        function toggleMenu() {
            const menu = document.getElementById('settings-menu');
            menu.classList.toggle('hidden');
        }

        function toggleEditMode() {
            appData.isEditable = !appData.isEditable;
            saveData();
            render();
            toggleMenu();
        }

        window.onclick = function(event) {
            if (!event.target.matches('button') && !event.target.closest('#settings-menu')) {
                const menu = document.getElementById('settings-menu');
                if (menu && !menu.classList.contains('hidden')) {
                    menu.classList.add('hidden');
                }
            }
        }

        function switchTab(tab) {
            appData.activeTab = tab;
            render();
        }

        function switchDay(day) {
            appData.currentDay = day;
            render();
        }

        function toggleAccordion(day, catIdx) {
            if (!appData.openAccordions) appData.openAccordions = {};
            const key = `${day}_${catIdx}`;
            appData.openAccordions[key] = appData.openAccordions[key] === false ? true : false;
            saveData();
            render();
        }

        function extractTime(timeStr) {
            const match = timeStr.match(/\d{2}:\d{2}/);
            return match ? match[0] : "00:00";
        }

        function addItem(day) {
            if (!appData.isEditable) {
                alert("目前為編輯鎖定狀態，請先至右上角「設定」解除鎖定後才能新增行程！");
                return;
            }
            const time = prompt("請輸入時間 (例如 13:00 或 13:00 - 14:30)：", "12:00");
            if (!time) return;
            const title = prompt("請輸入新行程名稱：");
            if (!title) return;
            const desc = prompt("請輸入行程備註說明：", "");
            
            appData.days[day].items.push({
                id: 'custom_' + Date.now(),
                time: time,
                title: title,
                desc: desc || "",
                map: "首爾",
                color: "border-cyan-500",
                isDefault: false
            });

            appData.days[day].items.sort((a, b) => {
                return extractTime(a.time).localeCompare(extractTime(b.time));
            });

            saveData();
            render();
        }

        function deleteItem(day, index) {
            if (!appData.isEditable) {
                alert("請先至右上角「設定」解除編輯鎖定後才能刪除行程！");
                return;
            }
            if (confirm("確定要刪除這個自訂行程嗎？")) {
                appData.days[day].items.splice(index, 1);
                saveData();
                render();
            }
        }

        function toggleChecklist(day, catIdx, itemIdx) {
            appData.checklistsByDay[day].categories[catIdx].items[itemIdx].checked = !appData.checklistsByDay[day].categories[catIdx].items[itemIdx].checked;
            saveData();
            render();
        }

        function toggleShoppingCheck(category, index) {
            appData.shopping[category][index].checked = !appData.shopping[category][index].checked;
            saveData();
            render();
        }

        function resetData() {
            if (confirm("確定要重置所有修改，恢復預設值嗎？")) {
                localStorage.removeItem('nmixx_ice_trip_data_v6');
                appData = JSON.parse(JSON.stringify(defaultData));
                render();
                alert("已恢復預設資料！");
                toggleMenu();
            }
        }

        function render() {
            const bodyEl = document.getElementById('app-body');
            const lockBadge = document.getElementById('lock-badge');
            const lockMenuBtn = document.getElementById('lock-menu-btn');

            if (appData.isEditable) {
                bodyEl.classList.add('is-editable');
                lockBadge.className = "text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold";
                lockBadge.innerText = "🔓 編輯解鎖中";
                lockMenuBtn.innerText = "🔒 鎖定編輯防誤觸";
                lockMenuBtn.className = "w-full text-left px-4 py-2 text-xs text-rose-300 hover:bg-slate-800 font-bold transition flex items-center gap-1.5 border-b border-slate-800";
            } else {
                bodyEl.classList.remove('is-editable');
                lockBadge.className = "text-[10px] bg-rose-500/80 text-white px-2 py-0.5 rounded-full font-bold";
                lockBadge.innerText = "🔒 已鎖定編輯";
                lockMenuBtn.innerText = "🔓 解除編輯鎖定";
                lockMenuBtn.className = "w-full text-left px-4 py-2 text-xs text-cyan-300 hover:bg-slate-800 font-bold transition flex items-center gap-1.5 border-b border-slate-800";
            }

            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.className = "day-btn px-4 py-1.5 rounded-full text-xs font-bold bg-white text-cyan-900 border border-cyan-200 hover:bg-cyan-50 transition shadow-sm";
            });
            const activeBtn = document.getElementById(`btn-day${appData.currentDay}`);
            if (activeBtn) {
                activeBtn.className = "day-btn px-4 py-1.5 rounded-full text-xs font-bold bg-cyan-600 text-white shadow-md shadow-cyan-500/30 transition";
            }

            document.getElementById('nav-itinerary').className = `flex flex-col items-center ${appData.activeTab === 'itinerary' ? 'text-cyan-700 font-bold' : 'hover:text-cyan-700'}`;
            document.getElementById('nav-checklist').className = `flex flex-col items-center ${appData.activeTab === 'checklist' ? 'text-cyan-700 font-bold' : 'hover:text-cyan-700'}`;
            document.getElementById('nav-shopping').className = `flex flex-col items-center ${appData.activeTab === 'shopping' ? 'text-cyan-700 font-bold' : 'hover:text-cyan-700'}`;

            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (appData.activeTab === 'itinerary') {
                const dayData = appData.days[appData.currentDay];
                
                let html = `
                    <div class="bg-white/80 backdrop-blur-md border border-cyan-200 rounded-2xl p-3 text-xs text-slate-800 font-medium flex justify-between items-center shadow-md">
                        <span>🏨 <strong>今日住宿：</strong> <span class="text-cyan-700 font-bold" contenteditable="${appData.isEditable}" onblur="appData.days[${appData.currentDay}].hotel=this.innerText; saveData();">${dayData.hotel}</span></span>
                        <span id="inline-countdown" class="bg-cyan-100 text-cyan-800 border border-cyan-300 px-2.5 py-1 rounded-full font-bold text-[11px]">計算中...</span>
                    </div>
                `;

                if (dayData.isConcertDay) {
                    html += `
                        <div id="urgent-warning" class="hidden text-xs bg-rose-500 text-white font-bold p-2.5 rounded-xl animate-bounce text-center shadow-md border border-rose-300">
                            ⚠️ 【緊急警示】距離演唱會開演已不到 3 小時，請準備出發！ 🎶
                        </div>
                    `;
                }

                dayData.items.forEach((item, index) => {
                    let deleteBtnHtml = '';
                    if (!item.isDefault && appData.isEditable) {
                        deleteBtnHtml = `<button onclick="deleteItem(${appData.currentDay}, ${index})" class="absolute top-2 right-2 text-slate-400 hover:text-rose-500 text-xs px-1.5 py-0.5 rounded transition">❌ 刪除</button>`;
                    }

                    html += `
                        <div class="bg-white/85 backdrop-blur-md rounded-2xl shadow-md p-4 border-l-4 ${item.color} border-slate-100 relative group">
                            ${deleteBtnHtml}
                            <div class="flex justify-between items-start pr-8">
                                <span class="text-xs font-bold text-cyan-800 bg-cyan-50 border border-cyan-200 px-2 py-0.5 rounded" contenteditable="${appData.isEditable}" onblur="appData.days[${appData.currentDay}].items[${index}].time=this.innerText; saveData();">${item.time}</span>
                                <a href="https://maps.google.com/?q=${item.map}" target="_blank" rel="noopener noreferrer" class="text-xs text-sky-600 hover:underline">📍 導航</a>
                            </div>
                            <h3 class="text-base font-bold mt-1.5 text-slate-800" contenteditable="${appData.isEditable}" onblur="appData.days[${appData.currentDay}].items[${index}].title=this.innerText; saveData();">${item.title}</h3>
                            <p class="text-xs text-slate-600 mt-1" contenteditable="${appData.isEditable}" onblur="appData.days[${appData.currentDay}].items[${index}].desc=this.innerText; saveData();">${item.desc}</p>
                        </div>
                    `;
                });

                html += `
                    <button onclick="addItem(${appData.currentDay})" class="w-full py-3 border-2 border-dashed border-cyan-300 text-cyan-700 rounded-2xl font-bold text-xs hover:bg-white/50 transition flex items-center justify-center gap-1 mt-3 shadow-sm">
                        ➕ 在 11/${appData.currentDay} 新增行程 ${appData.isEditable ? '' : '(需解鎖)'}
                    </button>
                `;

                container.innerHTML = html;

            } else if (appData.activeTab === 'checklist') {
                const dayDataObj = appData.checklistsByDay[appData.currentDay];
                
                let html = `
                    <div class="space-y-3">
                        <div class="bg-cyan-900/90 text-cyan-100 px-4 py-2.5 rounded-2xl text-xs font-bold shadow-md flex justify-between items-center">
                            <span>📋 ${dayDataObj.title}</span>
                            <span class="text-[10px] bg-cyan-700 px-2 py-0.5 rounded-full">互動選取</span>
                        </div>
                `;

                dayDataObj.categories.forEach((cat, catIdx) => {
                    const key = `${appData.currentDay}_${catIdx}`;
                    const isOpen = appData.openAccordions && appData.openAccordions[key] === false ? false : true;

                    html += `
                        <div class="bg-white/85 backdrop-blur-md rounded-2xl shadow-md border border-cyan-100 overflow-hidden">
                            <div onclick="toggleAccordion(${appData.currentDay}, ${catIdx})" class="px-4 py-3 bg-cyan-50/80 border-b border-cyan-100 flex justify-between items-center cursor-pointer select-none">
                                <h3 class="text-xs font-bold text-cyan-900">${cat.name}</h3>
                                <span class="text-xs text-cyan-700 font-bold">${isOpen ? '▲ 收合' : '▼ 展開'}</span>
                            </div>
                    `;

                    if (isOpen) {
                        html += `<div class="p-3 space-y-1.5">`;
                        cat.items.forEach((item, itemIdx) => {
                            html += `
                                <label class="flex items-center gap-3 p-2 hover:bg-cyan-50/50 rounded-xl cursor-pointer transition">
                                    <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="toggleChecklist(${appData.currentDay}, ${catIdx}, ${itemIdx})" class="w-4 h-4 text-cyan-600 rounded border-cyan-300 bg-white focus:ring-cyan-500">
                                    <span class="text-xs ${item.checked ? 'line-through text-slate-400' : 'text-slate-700'}">${item.text}</span>
                                </label>
                            `;
                        });
                        html += `</div>`;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
                container.innerHTML = html;

            } else if (appData.activeTab === 'shopping') {
                let html = `<div class="space-y-4">`;
                const shopCategories = [
                    { key: 'food', title: '🍲 想吃的韓國美食 / 雲西站推薦' },
                    { key: 'goods', title: '🛍️ 想買的戰利品 / 周邊 / 伴手禮' }
                ];

                shopCategories.forEach(cat => {
                    html += `
                        <div class="bg-white/85 backdrop-blur-md rounded-2xl shadow-md p-4 space-y-2 border border-cyan-100">
                            <h2 class="text-sm font-bold text-cyan-800 border-b border-cyan-100 pb-2">${cat.title}</h2>
                    `;
                    appData.shopping[cat.key].forEach((item, index) => {
                        html += `
                            <label class="flex items-center gap-3 p-2 hover:bg-cyan-50/50 rounded-xl cursor-pointer transition">
                                <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="toggleShoppingCheck('${cat.key}', ${index})" class="w-4 h-4 text-cyan-600 rounded border-cyan-300 bg-white focus:ring-cyan-500">
                                <span class="text-xs ${item.checked ? 'line-through text-slate-400' : 'text-slate-700'}">${item.text}</span>
                            </label>
                        `;
                    });
                    html += `</div>`;
                });
                html += `</div>`;
                container.innerHTML = html;
            }
        }

        function updateTimeAndCountdowns() {
            const now = new Date();
            
            const twHours = String(now.getHours()).padStart(2, '0');
            const twMinutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('taiwan-time').innerText = `${twHours}:${twMinutes}`;

            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const koreaTime = new Date(utc + (3600000 * 9));
            const krHours = String(koreaTime.getHours()).padStart(2, '0');
            const krMinutes = String(koreaTime.getMinutes()).padStart(2, '0');
            document.getElementById('korea-time').innerText = `${krHours}:${krMinutes}`;

            const dayData = appData.days[appData.currentDay];
            const inlineCountdownEl = document.getElementById('inline-countdown');
            
            if (inlineCountdownEl && dayData && dayData.targetTimeStr) {
                const targetDate = new Date(dayData.targetTimeStr);
                const activeNow = (appData.currentDay === 26 || appData.currentDay === 30) ? now : koreaTime;
                const diffMs = targetDate - activeNow;

                if (diffMs > 0) {
                    const h = Math.floor(diffMs / (1000 * 60 * 60));
                    const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                    
                    let prefix = "距離";
                    if (appData.currentDay === 26) prefix = "距離出發";
                    else if (appData.currentDay === 30) prefix = "距離退房";
                    else prefix = "距離開演";

                    inlineCountdownEl.innerText = `${prefix} ${h}h ${m}m`;
                } else {
                    inlineCountdownEl.innerText = `✨ 時間已到 / 進行中`;
                }

                const warningEl = document.getElementById('urgent-warning');
                if (warningEl && dayData.isConcertDay) {
                    const diffHours = diffMs / (1000 * 60 * 60);
                    if (diffHours > 0 && diffHours <= 3) {
                        warningEl.classList.remove('hidden');
                    } else {
                        warningEl.classList.add('hidden');
                    }
                }
            }
        }
        setInterval(updateTimeAndCountdowns, 1000);
        updateTimeAndCountdowns();

        function updateCountdown() {
            const departureDate = new Date('2026-11-26T18:30:00+08:00');
            const now = new Date();
            const diff = departureDate - now;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('countdown').innerText = `🐳 總出發：${days}天 ${hours}小時 🎶`;
            } else {
                document.getElementById('countdown').innerText = `✈️ 旅程進行中！`;
            }
        }
        updateCountdown();

        render();
    </script>
</body>
</html>
