            font-family: 'Noto Sans TC', sans-serif; 
            background:

                linear-gradient(135deg, #DDF7FC 0%, #B8EDF7 30%, #B8EDE5 70%, #91DCEB 100%);
            color: #0f2c3b;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-y: scroll;
        }
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        [contenteditable="true"]:focus { outline: 2px dashed #0284c7; background-color: rgba(2, 132, 199, 0.1); padding: 2px; border-radius: 4px; }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60px; border-radius: 16px; transition: background .15s, transform .1s; -webkit-tap-highlight-color: transparent; }
        .nav-btn:active { transform: scale(0.96); }
        .nav-btn.active { background: rgba(207, 250, 254, 0.9); color: #0e7490; font-weight: 700; }
        .jellyfish-float { animation: float 4s ease-in-out infinite; }
        .jellyfish-float-delayed { animation: float 5s ease-in-out infinite 2s; }

            <div id="countdown" class="text-xs bg-gradient-to-r from-cyan-500 to-teal-500 text-white font-bold px-3 py-1 rounded-full shadow-md animate-pulse inline-block mb-2">計算倒數中...</div>

    <div id="modal" class="hidden fixed inset-0 z-[60] bg-black/50 flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeModal()">

        function toggleMenu() {
            const menu = document.getElementById('settings-menu');
            menu.classList.toggle('hidden');
        }

        window.onclick = function(event) {
            if (!event.target.matches('button') && !event.target.closest('#settings-menu')) {
                const menu = document.getElementById('settings-menu');
                if (menu && !menu.classList.contains('hidden')) {
                    menu.classList.add('hidden');
                }
            }
        }

            appData.activeTab = tab;
            render();
        }

        function switchDay(day) {
            appData.currentDay = day;
            render();
        }

        function toggleAccordion(day, catIdx) {
            if (!appData.openAccordions) appData.openAccordions = {};
            const key = `${day}_${catIdx}`;
            appData.openAccordions[key] = appData.openAccordions[key] === false ? true : false;
            saveData();
            render();
        }

        function extractTime(timeStr) {
            const match = timeStr.match(/\d{2}:\d{2}/);
            return match ? match[0] : "00:00";
        }

        function toggleChecklist(day, catIdx, itemIdx) {
            appData.checklistsByDay[day].categories[catIdx].items[itemIdx].checked = !appData.checklistsByDay[day].categories[catIdx].items[itemIdx].checked;
            saveData();
            render();
        }

        function toggleShoppingCheck(category, index) {
            appData.shopping[category][index].checked = !appData.shopping[category][index].checked;
            saveData();
            render();
        }

        function resetData() {
            if (confirm("確定要重置所有修改，恢復預設值嗎？")) {
                localStorage.removeItem('nmixx_ice_trip_data_v5');
                appData = JSON.parse(JSON.stringify(defaultData));
                render();
                alert("已恢復預設資料！");
            }
        }

        // ===== 資料來源：Excel / Google 試算表 =====
        const SHEETS = ['日設定', '行程', '準備清單', '購物清單'];
        const COLORS = { '一般': 'border-cyan-500', '交通': 'border-sky-500', '演唱會': 'border-pink-500', '返程': 'border-teal-500' };
        const SHEET_KEY = 'trip_sheet_id';

        function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        function renderNav() {
            document.getElementById('day-nav-bar').innerHTML = Object.keys(appData.days).map(d =>
                `<button onclick="switchDay(${d})" id="btn-day${d}" class="day-btn px-4 py-1.5 rounded-full text-xs font-bold">11/${d}</button>`).join('');
        }

        function addChecklistItem(d, c) {
            openForm({ title: '➕ 新增準備項目', fields: [{ name: 'text', label: '項目', required: true }],
                onSubmit: v => { appData.checklistsByDay[d].categories[c].items.push({ text: v.text.trim(), checked: false, custom: true }); saveData(); render(); } });
        }
        function delChecklistItem(d, c, i) { appData.checklistsByDay[d].categories[c].items.splice(i, 1); saveData(); render(); }
        function addShoppingItem(k) {
            openForm({ title: '➕ 新增購物項目', fields: [{ name: 'text', label: '項目', required: true }],
                onSubmit: v => { appData.shopping[k].push({ text: v.text.trim(), checked: false, custom: true }); saveData(); render(); } });
        }
        function delShoppingItem(k, i) { appData.shopping[k].splice(i, 1); saveData(); render(); }

        function applySheets(S) {
            const chk = new Set(), keep = a => a.forEach(i => i.checked && chk.add(i.text));
            Object.values(appData.checklistsByDay).forEach(d => d.categories.forEach(c => keep(c.items)));
            keep(appData.shopping.food); keep(appData.shopping.goods);
            const num = v => { const m = String(v).match(/(\d+)\s*$/); return m ? +m[1] : NaN; };
            const old = appData, days = {}, cl = {};
            (S['日設定'] || []).forEach(r => {
                const d = num(r['日']); if (isNaN(d)) return;
                days[d] = { hotel: r['住宿'] || '', targetTimeStr: r['倒數目標時間'] || '', countdownLabel: r['倒數標題'] || '',
                            isConcertDay: /^(Y|是|1|TRUE)/i.test(r['演唱會日'] || ''), items: [] };
                cl[d] = { title: r['準備清單標題'] || `11/${d} 準備清單`, categories: [] };
            });
            (S['行程'] || []).forEach((r, i) => {
                const d = num(r['日']); if (!days[d] || !r['標題']) return;
                days[d].items.push({ id: 'def_s' + i, time: r['時間'] || '', title: r['標題'], desc: r['備註'] || '',
                    map: r['地圖關鍵字'] || r['標題'], color: COLORS[r['類型']] || COLORS['一般'], isDefault: true });
            });
            (S['準備清單'] || []).forEach(r => {
                const d = num(r['日']); if (!cl[d] || !r['項目']) return;
                const name = r['分類'] || '其他'; let c = cl[d].categories.find(x => x.name === name);
                if (!c) cl[d].categories.push(c = { name, items: [] });
                c.items.push({ text: r['項目'], checked: chk.has(r['項目']) });
            });
            const shop = { food: [], goods: [] };
            (S['購物清單'] || []).forEach(r => {
                if (!r['項目']) return;
                shop[/美食|food/i.test(r['類別']) ? 'food' : 'goods'].push({ text: r['項目'], checked: chk.has(r['項目']) });
            });
            // 保留自己在 App 內新增的內容
            Object.keys(days).forEach(d => {
                const o = old.days[d];
                if (o) { days[d].items.push(...o.items.filter(i => !i.isDefault)); days[d].items.sort((a, b) => extractTime(a.time).localeCompare(extractTime(b.time))); }
                const oc = old.checklistsByDay[d];
                if (oc) oc.categories.forEach(c => {
                    const cust = c.items.filter(i => i.custom); if (!cust.length) return;
                    let t = cl[d].categories.find(x => x.name === c.name);
                    if (!t) cl[d].categories.push(t = { name: c.name, items: [] });
                    t.items.push(...cust);
                });
            });
            ['food', 'goods'].forEach(k => shop[k].push(...old.shopping[k].filter(i => i.custom)));
            appData.days = days; appData.checklistsByDay = cl; appData.shopping = shop;
            if (!days[appData.currentDay]) appData.currentDay = +Object.keys(days)[0];
            saveData(); render(); updateTimeAndCountdowns();
        }

        function finishImport(S, silent) {
            if (!S['日設定'] || !S['行程']) { if (!silent) alert('找不到「日設定」或「行程」工作表，請使用範本格式。'); return false; }
            applySheets(S); if (!silent) alert('✅ 已更新基礎資料（你自己新增的內容已保留）'); return true;
        }

        function importExcel(file) {
            if (!file) return;
            const rd = new FileReader();
            rd.onload = e => {
                try {
                    const wb = XLSX.read(e.target.result, { type: 'array' }), S = {};
                    SHEETS.forEach(n => { if (wb.Sheets[n]) S[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { raw: false, defval: '' }); });
                    finishImport(S);
                } catch (err) { alert('讀取失敗：' + err.message); }
            };
            rd.readAsArrayBuffer(file);
        }

        function parseCSV(t) {
            const rows = []; let r = [], f = '', q = false;
            for (let i = 0; i < t.length; i++) {
                const c = t[i];
                if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
                else if (c === '"') q = true;
                else if (c === ',') { r.push(f); f = ''; }
                else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; }
                else f += c;
            }
            if (f || r.length) { r.push(f); rows.push(r); }
            const head = (rows.shift() || []).map(h => h.trim());
            return rows.filter(x => x.some(v => v)).map(x => Object.fromEntries(head.map((h, i) => [h, (x[i] || '').trim()])));
        }

        async function fetchSheet(id) {
            const S = {};
            for (const n of SHEETS) {
                const r = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}`);
                if (!r.ok) throw new Error(n);
                S[n] = parseCSV(await r.text());
            }
            return S;
        }

        async function syncGoogleSheet() {
            let id = prompt('貼上 Google 試算表網址或 ID\n（需設為「知道連結的任何人可檢視」）：', localStorage.getItem(SHEET_KEY) || '');
            if (!id) return;
            id = (id.match(/\/d\/([\w-]+)/) || [])[1] || id.trim();
            try { finishImport(await fetchSheet(id)); localStorage.setItem(SHEET_KEY, id); }
            catch (err) { alert('同步失敗，請確認網路、分享權限與工作表名稱（' + err.message + '）'); }
        }

        (async function autoSync() {
            const id = localStorage.getItem(SHEET_KEY);
            if (!id || !navigator.onLine) return;
            try { finishImport(await fetchSheet(id), true); } catch (e) { /* 離線或失敗時沿用本機資料 */ }
        })();

        // ===== 表單（取代 prompt）與行程編輯 =====
        let modalSubmit = null;
        function openForm({ title, fields, values = {}, onSubmit, onDelete }) {
            document.getElementById('modal-title').textContent = title;
            const cls = 'w-full mt-0.5 border border-cyan-200 rounded-xl px-3 py-2 text-base bg-white font-normal';
            document.getElementById('modal-fields').innerHTML = fields.map(f => {
                const v = values[f.name] ?? '';
                const input = f.type === 'select'
                    ? `<select name="${f.name}" class="${cls}">${f.options.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
                    : f.type === 'textarea'
                    ? `<textarea name="${f.name}" rows="2" class="${cls}">${esc(v)}</textarea>`
                    : `<input name="${f.name}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.required ? 'required' : ''} class="${cls}">`;
                return `<label class="block text-[11px] font-bold text-slate-600">${f.label}${input}</label>`;
            }).join('');
            const del = document.getElementById('modal-del');
            del.classList.toggle('hidden', !onDelete);
            del.onclick = () => { closeModal(); onDelete(); };
            modalSubmit = onSubmit;
            document.getElementById('modal').classList.remove('hidden');
            const first = document.querySelector('#modal-fields input, #modal-fields textarea'); if (first) first.focus();
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); modalSubmit = null; }
        function submitModal(e) {
            e.preventDefault();
            const v = Object.fromEntries(new FormData(e.target));
            const cb = modalSubmit; closeModal(); if (cb) cb(v);
            return false;
        }

        const TYPES = Object.keys(COLORS);
        const typeOf = c => TYPES.find(t => COLORS[t] === c) || '一般';
        const itemFields = [
            { name: 'time', label: '時間', ph: '13:00 或 13:00 - 14:30', required: true },
            { name: 'title', label: '行程名稱', required: true },
            { name: 'desc', label: '備註', type: 'textarea' },
            { name: 'map', label: '地圖搜尋關鍵字（留空＝行程名稱）' },
            { name: 'type', label: '類型（左側色條）', type: 'select', options: TYPES }
        ];
        function mkItem(v, isDefault, id) {
            const title = v.title.trim();
            return { id: id || 'custom_' + Date.now(), time: v.time.trim(), title, desc: (v.desc || '').trim(),
                     map: (v.map || '').trim() || title, color: COLORS[v.type] || COLORS['一般'], isDefault };
        }
        function addItem(day) {
            openForm({ title: `➕ 新增 11/${day} 行程`, fields: itemFields, values: { time: '12:00', type: '一般' }, onSubmit: v => {
                appData.days[day].items.push(mkItem(v, false)); saveData(); render();
            } });
        }
        function editItem(day, i) {
            const it = appData.days[day].items[i];
            openForm({ title: '✏️ 編輯行程' + (it.isDefault ? '（基礎行程，下次同步會依表格還原）' : ''), fields: itemFields,
                values: { ...it, type: typeOf(it.color) },
                onSubmit: v => { appData.days[day].items[i] = mkItem(v, it.isDefault, it.id); saveData(); render(); },
                onDelete: () => { if (confirm('確定刪除這個行程？')) { appData.days[day].items.splice(i, 1); saveData(); render(); } } });
        }
        function sortItems(arr) { arr.sort((a, b) => extractTime(a.time).localeCompare(extractTime(b.time))); }

        function render() {
            renderNav();
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.className = "day-btn px-4 py-1.5 rounded-full text-xs font-bold bg-white text-cyan-900 border border-cyan-200 hover:bg-cyan-50 transition shadow-sm";
            });
            const activeBtn = document.getElementById(`btn-day${appData.currentDay}`);
            if (activeBtn) {
                activeBtn.className = "day-btn px-4 py-1.5 rounded-full text-xs font-bold bg-cyan-600 text-white shadow-md shadow-cyan-500/30 transition";
            }

            document.getElementById('nav-itinerary').className = `nav-btn ${appData.activeTab === 'itinerary' ? 'active' : ''}`;
            document.getElementById('nav-checklist').className = `nav-btn ${appData.activeTab === 'checklist' ? 'active' : ''}`;
            document.getElementById('nav-shopping').className = `nav-btn ${appData.activeTab === 'shopping' ? 'active' : ''}`;

            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (appData.activeTab === 'itinerary') {
                const dayData = appData.days[appData.currentDay];
                
                let html = `
                    <div class="bg-white/80 backdrop-blur-md border border-cyan-200 rounded-2xl p-3 text-xs text-slate-800 font-medium flex justify-between items-center shadow-md">
                        <span>🏨 <strong>今日住宿：</strong> <span class="text-cyan-700 font-bold" contenteditable="true" onblur="appData.days[${appData.currentDay}].hotel=this.innerText; saveData();">${esc(dayData.hotel)}</span></span>
                        <span id="inline-countdown" class="bg-cyan-100 text-cyan-800 border border-cyan-300 px-2.5 py-1 rounded-full font-bold text-[11px]">計算中...</span>
                    </div>
                `;

                if (dayData.isConcertDay) {
                    html += `
                        <div id="urgent-warning" class="hidden text-xs bg-rose-500 text-white font-bold p-2.5 rounded-xl animate-bounce text-center shadow-md border border-rose-300">
                            ⚠️ 【緊急警示】距離演唱會開演已不到 3 小時，請準備出發！ 🎶
                        </div>
                    `;
                }

                sortItems(dayData.items);
                dayData.items.forEach((item, index) => {
                    const d = appData.currentDay;
                    const btn = 'px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 disabled:opacity-30';
                    html += `
                        <div class="bg-white/85 backdrop-blur-md rounded-2xl shadow-md p-4 border-l-4 ${item.color} border-slate-100">
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-bold text-cyan-800 bg-cyan-50 border border-cyan-200 px-2 py-0.5 rounded">${esc(item.time)}</span>
                                <a href="https://maps.google.com/?q=${encodeURIComponent(item.map)}" target="_blank" class="text-xs text-sky-600 hover:underline">📍 導航</a>
                            </div>
                            <h3 class="text-base font-bold mt-1.5 text-slate-800">${esc(item.title)}</h3>
                            ${item.desc ? `<p class="text-xs text-slate-600 mt-1 whitespace-pre-line">${esc(item.desc)}</p>` : ''}
                            <div class="flex justify-end gap-1.5 mt-2 text-xs">
                                <button onclick="editItem(${d}, ${index})" class="${btn}">✏️ 編輯</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <button onclick="addItem(${appData.currentDay})" class="w-full py-3 border-2 border-dashed border-cyan-300 text-cyan-700 rounded-2xl font-bold text-xs hover:bg-white/50 transition flex items-center justify-center gap-1 mt-3 shadow-sm">
                        ➕ 在 11/${appData.currentDay} 新增行程
                    </button>
                `;

                container.innerHTML = html;

            } else if (appData.activeTab === 'checklist') {
                const dayDataObj = appData.checklistsByDay[appData.currentDay];
                
                let html = `
                    <div class="space-y-3">
                        <div class="bg-cyan-900/90 text-cyan-100 px-4 py-2.5 rounded-2xl text-xs font-bold shadow-md flex justify-between items-center">
                            <span>📋 ${dayDataObj.title}</span>
                        </div>
                `;

                dayDataObj.categories.forEach((cat, catIdx) => {
                    const key = `${appData.currentDay}_${catIdx}`;
                    const isOpen = appData.openAccordions && appData.openAccordions[key] === false ? false : true; // 預設展開

                    html += `
                        <div class="bg-white/85 backdrop-blur-md rounded-2xl shadow-md border border-cyan-100 overflow-hidden">
                            <div onclick="toggleAccordion(${appData.currentDay}, ${catIdx})" class="px-4 py-3 bg-cyan-50/80 border-b border-cyan-100 flex justify-between items-center cursor-pointer select-none">
                                <h3 class="text-xs font-bold text-cyan-900">${cat.name}</h3>
                                <span class="text-xs text-cyan-700 font-bold">${isOpen ? '▲ 收合' : '▼ 展開'}</span>
                            </div>
                    `;

                    if (isOpen) {
                        html += `<div class="p-3 space-y-1.5">`;
                        cat.items.forEach((item, itemIdx) => {
                            html += `
                                <label class="flex items-center gap-3 p-2 hover:bg-cyan-50/50 rounded-xl cursor-pointer transition">
                                    <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="toggleChecklist(${appData.currentDay}, ${catIdx}, ${itemIdx})" class="w-4 h-4 text-cyan-600 rounded border-cyan-300 bg-white focus:ring-cyan-500">
                                    <span class="text-xs ${item.checked ? 'line-through text-slate-400' : 'text-slate-700'}">${esc(item.text)}</span>
                                    ${item.custom ? `<button onclick="delChecklistItem(${appData.currentDay}, ${catIdx}, ${itemIdx})" class="ml-auto text-slate-400 hover:text-rose-500 text-xs px-1">✕</button>` : ''}
                                </label>
                            `;
                        });
                        html += `<button onclick="addChecklistItem(${appData.currentDay}, ${catIdx})" class="w-full py-1.5 text-[11px] text-cyan-700 border border-dashed border-cyan-300 rounded-xl">➕ 新增項目</button></div>`;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
                container.innerHTML = html;

            } else if (appData.activeTab === 'shopping') {
                let html = `<div class="space-y-4">`;
                const shopCategories = [
                    { key: 'food', title: '🍲 想吃的韓國美食 / 雲西站推薦' },
                    { key: 'goods', title: '🛍️ 想買的戰利品 / 周邊 / 伴手禮' }
                ];

                shopCategories.forEach(cat => {
                    html += `
                        <div class="bg-white/85 backdrop-blur-md rounded-2xl shadow-md p-4 space-y-2 border border-cyan-100">
                            <h2 class="text-sm font-bold text-cyan-800 border-b border-cyan-100 pb-2">${cat.title}</h2>
                    `;
                    appData.shopping[cat.key].forEach((item, index) => {
                        html += `
                            <label class="flex items-center gap-3 p-2 hover:bg-cyan-50/50 rounded-xl cursor-pointer transition">
                                <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="toggleShoppingCheck('${cat.key}', ${index})" class="w-4 h-4 text-cyan-600 rounded border-cyan-300 bg-white focus:ring-cyan-500">
                                <span class="text-xs ${item.checked ? 'line-through text-slate-400' : 'text-slate-700'}">${esc(item.text)}</span>
                                ${item.custom ? `<button onclick="delShoppingItem('${cat.key}', ${index})" class="ml-auto text-slate-400 hover:text-rose-500 text-xs px-1">✕</button>` : ''}
                            </label>
                        `;
                    });
                    html += `<button onclick="addShoppingItem('${cat.key}')" class="w-full py-1.5 text-[11px] text-cyan-700 border border-dashed border-cyan-300 rounded-xl">➕ 新增項目</button></div>`;
                });
                html += `</div>`;
                container.innerHTML = html;
            }
        }

        function updateTimeAndCountdowns() {
            updateCountdown();
            const now = new Date();
            
            // 顯示到分鐘
            const twHours = String(now.getHours()).padStart(2, '0');
            const twMinutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('taiwan-time').innerText = `${twHours}:${twMinutes}`;

            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const koreaTime = new Date(utc + (3600000 * 9));
            const krHours = String(koreaTime.getHours()).padStart(2, '0');
            const krMinutes = String(koreaTime.getMinutes()).padStart(2, '0');
            document.getElementById('korea-time').innerText = `${krHours}:${krMinutes}`;

            const dayData = appData.days[appData.currentDay];
            const inlineCountdownEl = document.getElementById('inline-countdown');
            
            if (inlineCountdownEl && dayData && dayData.targetTimeStr) {
                const targetDate = new Date(dayData.targetTimeStr);
                const activeNow = now;
                const diffMs = targetDate - activeNow;

                if (diffMs > 0) {
                    const h = Math.floor(diffMs / (1000 * 60 * 60));
                    const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                    
                    let prefix = "距離";
                    if (appData.currentDay === 26) prefix = "距離出發";
                    else if (appData.currentDay === 30) prefix = "距離退房";
                    else prefix = "距離開演";
                    if (dayData.countdownLabel) prefix = dayData.countdownLabel;

                    inlineCountdownEl.innerText = `${prefix} ${h}h ${m}m`;
                } else {
                    inlineCountdownEl.innerText = `✨ 時間已到 / 進行中`;
                }

                const warningEl = document.getElementById('urgent-warning');
                if (warningEl && dayData.isConcertDay) {
                    const diffHours = diffMs / (1000 * 60 * 60);
                    if (diffHours > 0 && diffHours <= 3) {
                        warningEl.classList.remove('hidden');
                    } else {
                        warningEl.classList.add('hidden');
                    }
                }
            }
        }
        setInterval(updateTimeAndCountdowns, 1000);
        updateTimeAndCountdowns();

        function updateCountdown() {
            const departureDate = new Date('2026-11-26T18:30:00+08:00');
            const now = new Date();
            const diff = departureDate - now;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('countdown').innerText = `🐳 總出發：${days}天 ${hours}小時 🎶`;
            } else {
                document.getElementById('countdown').innerText = `✈️ 旅程進行中！`;
            }
        }
        updateCountdown();

        render();
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
